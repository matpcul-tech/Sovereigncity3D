<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilitator Dashboard — Sovereign City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f8f6f2; --surface: #fff; --border: #e0dbd2;
  --text: #1a1816; --sub: #6b645b;
  --gold: #c49b28; --green: #3a7a50; --danger: #b83030;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

.fac-header { background: #14120F; color: #E8C064; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
.fac-header h1 { font-family: Archivo, sans-serif; font-size: 19px; font-weight: 900; letter-spacing: .04em; }
.fac-header .eyebrow { font-size: 10px; letter-spacing: .14em; color: #9A917F; margin-bottom: 1px; }
.code-badge { background: #E8C064; color: #14120F; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 20px; letter-spacing: .12em; }
.auto-tag { margin-left: auto; font-size: 11px; color: #9A917F; }

.fac-controls { padding: 11px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fac-controls label { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
.hustle-input { flex: 1; min-width: 180px; max-width: 440px; border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 14px; font-family: inherit; }
.hustle-input:focus { outline: none; border-color: var(--gold); }

.btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; transition: opacity .15s; white-space: nowrap; }
.btn:hover { opacity: .82; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-gold { background: #E8C064; color: #14120F; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }

.fac-main { padding: 20px 24px; }
.fac-section-title { font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sub); margin-bottom: 10px; }

.founder-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 28px; }
.founder-table th { background: #F5F0E8; text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); border-bottom: 1px solid var(--border); }
.founder-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.founder-table tr:last-child td { border-bottom: none; }
.founder-table tr:hover td { background: #faf8f4; }

.stage-pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.s1 { background: #e8edf2; color: #4a6a88; }
.s2 { background: #ddeef2; color: #2a6a7a; }
.s3 { background: #ddeedd; color: #2a6a3a; }
.s4 { background: #f2e8cc; color: #7a5a1a; }
.s5 { background: #fdf0c0; color: #8a6a00; }

.pos { color: var(--green); font-weight: 600; }
.neg { color: var(--danger); font-weight: 600; }
.ts { font-size: 11px; color: var(--sub); }
.fn { font-weight: 600; }
.bn { font-size: 12px; color: var(--sub); }

.vocab-wrap { overflow-x: auto; margin-bottom: 28px; }
.vocab-table { border-collapse: collapse; background: var(--surface); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.vocab-table th { padding: 0 4px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--sub); background: #F5F0E8; border-bottom: 1px solid var(--border); vertical-align: bottom; text-align: center; min-width: 28px; }
.vocab-table th.th-name { text-align: left; min-width: 120px; padding: 9px 14px 4px; }
.vocab-table th .rh { display: block; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; padding: 4px 0; max-height: 100px; overflow: hidden; }
.vocab-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
.vocab-table td.td-name { text-align: left; font-weight: 600; white-space: nowrap; padding-right: 18px; }
.vocab-table tr:last-child td { border-bottom: none; }
.vocab-table tr:hover td { background: #faf8f4; }
.vc { color: var(--green); font-size: 15px; line-height: 1; }

.code-form { max-width: 400px; margin: 80px auto; padding: 32px; background: var(--surface); border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.09); text-align: center; }
.code-form h2 { font-family: Archivo, sans-serif; font-size: 22px; margin-bottom: 8px; }
.code-form p { color: var(--sub); margin-bottom: 24px; font-size: 14px; }
.code-form input { width: 100%; border: 2px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 22px; font-weight: 700; text-align: center; letter-spacing: .2em; text-transform: uppercase; font-family: Archivo, sans-serif; margin-bottom: 16px; }
.code-form input:focus { outline: none; border-color: var(--gold); }

.fac-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #14120F; color: #E8C064; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9999; }
.fac-toast.show { opacity: 1; }

@media print {
  .fac-header { background: none !important; color: #14120F !important; border-bottom: 2px solid #14120F; padding: 8px 0; }
  .code-badge { background: none !important; color: #14120F !important; border: 1.5px solid #14120F; }
  .auto-tag { color: #555 !important; }
  .fac-controls { display: none; }
  body { background: #fff; }
  .founder-table, .vocab-table { box-shadow: none; border: 1px solid #ccc; border-radius: 0; }
  .founder-table th, .vocab-table th { background: #f0f0f0 !important; }
  .fac-main { padding: 12px 0; }
  .fac-toast { display: none; }
}
  </style>
</head>
<body>
  <div id="fac-root"></div>
  <script>
window.SC_SUPABASE_URL='%%SUPABASE_URL%%';
window.SC_SUPABASE_ANON_KEY='%%SUPABASE_ANON_KEY%%';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
/* =========================================================
   SOVEREIGN CITY — FACILITATOR DASHBOARD
   Access: facilitator.html?code=TOWN_CODE
   No auth required — the class code IS the access credential.
   ========================================================= */
const VOCAB_TERMS = [
  'Value Proposition','Customer Discovery','Rejection Handling',
  'Churn','Overhead','Payroll','Revenue vs Profit','Runway',
  'Market Timing','Pricing Power','Competitive Moat','Blue Ocean',
  'Equity Dilution','Cap Table','Valuation','Systems','Resilience','Sovereignty'
];
const STAGE_NAMES = ['','Ideator','Hustler','Builder','Scaler','Sovereign'];

function fmt(n) {
  if (n == null || isNaN(n)) return '$0';
  return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeSince(ts) {
  if (!ts) return '—';
  const s = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

let sb = null, townId = null, founders = [], urlCode = '';

function getUrlCode() {
  return (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
}

async function loadData() {
  if (!sb || !urlCode) return;
  try {
    const { data: town } = await sb.from('towns').select('id,daily_challenge').eq('code', urlCode).maybeSingle();
    if (town) {
      townId = town.id;
      const inp = document.getElementById('challengeInput');
      if (inp && !inp._dirty) inp.value = town.daily_challenge || '';
    }
    const { data: saves } = await sb.from('saves')
      .select('founder_name,data,updated_at')
      .eq('town_code', urlCode)
      .order('updated_at', { ascending: false });
    founders = saves || [];
  } catch (e) { console.warn('[fac] load error', e); }
  renderTable();
  const ts = document.getElementById('lastRefresh');
  if (ts) ts.textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function renderTable() {
  const tbody = document.getElementById('founderTbody');
  const vwrap = document.getElementById('vocabWrap');
  if (!tbody) return;

  if (!founders.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#9A917F">No founders have joined this town yet.</td></tr>';
    if (vwrap) vwrap.innerHTML = '<p style="color:var(--sub);font-size:13px">No founders yet.</p>';
    return;
  }

  tbody.innerHTML = founders.map(row => {
    const d = row.data || {};
    const biz = d.biz || {};
    const st = d.stage || 1;
    const p = d.lastProfit;
    return '<tr>' +
      '<td><div class="fn">' + esc(row.founder_name) + '</div><div class="bn">' + esc(biz.name||'—') + '</div></td>' +
      '<td>' + esc(biz.industry||'—') + '</td>' +
      '<td><span class="stage-pill s' + st + '">' + esc(STAGE_NAMES[st]||'Ideator') + '</span></td>' +
      '<td>' + (d.customers||0) + '</td>' +
      '<td class="' + (p>0?'pos':p<0?'neg':'') + '">' + fmt(p) + '/day</td>' +
      '<td>' + (d.day||1) + '</td>' +
      '<td>' + ((d.learned||[]).length) + '</td>' +
      '<td>' + ((d.insights||[]).length) + '</td>' +
      '<td class="ts">' + timeSince(row.updated_at) + '</td>' +
    '</tr>';
  }).join('');

  if (vwrap) renderVocabGrid(vwrap);
}

function renderVocabGrid(container) {
  const earned = new Set();
  founders.forEach(r => ((r.data && r.data.learned)||[]).forEach(l => l.t && earned.add(l.t)));
  const cols = VOCAB_TERMS.filter(t => earned.has(t));

  if (!cols.length) {
    container.innerHTML = '<p style="color:var(--sub);font-size:13px">No vocabulary terms unlocked yet.</p>';
    return;
  }

  const hdr = '<tr><th class="th-name">Founder</th>' +
    cols.map(t => '<th><span class="rh" title="' + esc(t) + '">' + esc(t) + '</span></th>').join('') + '</tr>';

  const rows = founders.map(r => {
    const has = new Set(((r.data && r.data.learned)||[]).map(l=>l.t));
    return '<tr><td class="td-name">' + esc(r.founder_name) + '</td>' +
      cols.map(t => '<td>' + (has.has(t)?'<span class="vc">✓</span>':'') + '</td>').join('') + '</tr>';
  }).join('');

  container.innerHTML = '<div class="vocab-wrap"><table class="vocab-table"><thead>' + hdr + '</thead><tbody>' + rows + '</tbody></table></div>';
}

async function setChallenge() {
  if (!sb) { showToast('Backend not configured.'); return; }
  if (!townId) {
    const { data: t } = await sb.from('towns').select('id').eq('code', urlCode).maybeSingle();
    if (t) townId = t.id;
    if (!townId) { showToast('Town not found. Have a player join first.'); return; }
  }
  const inp = document.getElementById('challengeInput');
  const val = ((inp && inp.value) || '').trim();
  const btn = document.getElementById('setChallengeBtn');
  if (btn) btn.disabled = true;
  const { error } = await sb.from('towns').update({ daily_challenge: val || null }).eq('id', townId);
  if (btn) btn.disabled = false;
  if (inp) inp._dirty = false;
  showToast(error ? 'Error: ' + error.message : val ? 'Challenge set! Players see it within a minute.' : 'Challenge cleared.');
}

function exportCSV() {
  const headers = ['Founder Name','Business','Industry','Stage','Customers','Days','Profit/Loss per Day','Terms Learned','Insights Earned'];
  const rows = founders.map(r => {
    const d = r.data||{}, b = d.biz||{};
    return [r.founder_name||'', b.name||'', b.industry||'', STAGE_NAMES[d.stage||1]||'Ideator',
            d.customers||0, d.day||1, d.lastProfit||0,
            (d.learned||[]).length, (d.insights||[]).length
    ].map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',');
  });
  const csv = [headers.join(','), ...rows].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'sovereign-city-' + urlCode + '-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

let _toastTimer;
function showToast(msg) {
  let el = document.getElementById('facToast');
  if (!el) { el = Object.assign(document.createElement('div'), { id:'facToast', className:'fac-toast' }); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function subscribeRealtime() {
  if (!sb || !urlCode) return;
  sb.channel('fac-saves-' + urlCode)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'saves', filter: 'town_code=eq.' + urlCode },
        () => loadData())
    .subscribe();
}

function renderShell() {
  document.getElementById('fac-root').innerHTML =
    '<header class="fac-header">' +
      '<div><div class="eyebrow">SOVEREIGN CITY</div><h1>Facilitator Dashboard</h1></div>' +
      '<span class="code-badge">' + esc(urlCode) + '</span>' +
      '<span class="auto-tag" id="lastRefresh">Loading…</span>' +
    '</header>' +
    '<div class="fac-controls">' +
      '<label for="challengeInput">Today\'s Hustle</label>' +
      '<input id="challengeInput" class="hustle-input" type="text" maxlength="160" placeholder="Set a custom challenge visible to all founders in this town…">' +
      '<button id="setChallengeBtn" class="btn btn-gold">Set Challenge</button>' +
      '<button class="btn btn-outline" id="exportBtn">⬇ Export Session Report (CSV)</button>' +
      '<button class="btn btn-outline" onclick="window.print()">🖨 Print</button>' +
    '</div>' +
    '<div class="fac-main">' +
      '<div class="fac-section-title">Founders — Town ' + esc(urlCode) + '</div>' +
      '<table class="founder-table">' +
        '<thead><tr>' +
          '<th>Founder / Business</th><th>Industry</th><th>Stage</th>' +
          '<th>Customers</th><th>Daily P&amp;L</th><th>Days</th>' +
          '<th>Terms</th><th>Insights</th><th>Last Active</th>' +
        '</tr></thead>' +
        '<tbody id="founderTbody"><tr><td colspan="9" style="text-align:center;padding:32px;color:#9A917F">Loading…</td></tr></tbody>' +
      '</table>' +
      '<div class="fac-section-title">Vocabulary Progress</div>' +
      '<div id="vocabWrap">Loading…</div>' +
    '</div>';

  document.getElementById('setChallengeBtn').addEventListener('click', setChallenge);
  document.getElementById('exportBtn').addEventListener('click', exportCSV);
  const inp = document.getElementById('challengeInput');
  inp.addEventListener('input', () => { inp._dirty = true; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') setChallenge(); });
}

function renderCodeForm() {
  document.getElementById('fac-root').innerHTML =
    '<header class="fac-header"><div><h1>Facilitator Dashboard</h1></div></header>' +
    '<div class="code-form">' +
      '<div style="font-size:40px;margin-bottom:12px">🏫</div>' +
      '<h2>Enter Class Code</h2>' +
      '<p>Enter the 6-character code you shared with your class.</p>' +
      '<input id="codeInp" type="text" maxlength="6" placeholder="ABC123" autocomplete="off">' +
      '<button class="btn btn-gold" id="goCodeBtn" style="width:100%;padding:13px;font-size:15px">Open Dashboard</button>' +
    '</div>';

  const inp = document.getElementById('codeInp');
  const go = () => {
    const code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    if (!code) return;
    location.href = location.pathname + '?code=' + code;
  };
  inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
  inp.addEventListener('keydown', e => { if (e.key==='Enter') go(); });
  document.getElementById('goCodeBtn').addEventListener('click', go);
  inp.focus();
}

document.addEventListener('DOMContentLoaded', async () => {
  urlCode = getUrlCode();
  if (!urlCode) { renderCodeForm(); return; }

  const url = window.SC_SUPABASE_URL || '', key = window.SC_SUPABASE_ANON_KEY || '';
  if (url && url.indexOf('%%') < 0 && key && key.indexOf('%%') < 0 && window.supabase)
    sb = window.supabase.createClient(url, key);

  renderShell();

  if (!sb) {
    document.getElementById('founderTbody').innerHTML =
      '<tr><td colspan="9" style="text-align:center;padding:32px;color:#b83030">Backend not configured. Add the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets, then redeploy.</td></tr>';
    return;
  }

  await loadData();
  subscribeRealtime();
  setInterval(loadData, 60000);
});
  </script>
</body>
</html>
